server:
  port: 7777

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: bank
              uri: lb://payment-service
              predicates:
                - Path=/bank-service/**

            # Forwards full path + query (e.g. /shopping-service/products/page?page=0&size=12) to shopping-service
            - id: shopping
              uri: lb://shopping-service
              predicates:
                - Path=/shopping-service/**

            - id: email
              uri: lb://email-service
              predicates:
                - Path=/email-service/**