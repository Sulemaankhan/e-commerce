server:
  port: 7777

# CORS: allow any origin by default (any http/https, host, port). To restrict, set allow-all: false and list origins.
# cors:
#   allow-all: true
#   allowed-origins: http://localhost:3000,https://myapp.example.com

# JWT secret (must match shopping-service app.jwt.secret)
app:
  jwt:
    secret: your-256-bit-secret-key-for-jwt-signing-must-be-long-enough

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # CORS is added only in CorsGlobalFilter (beforeCommit). No globalcors here to avoid duplicate headers.
      routes:
        - id: bank
          uri: lb://payment-service
          predicates:
            - Path=/bank-service/**

        - id: shopping
          uri: lb://shopping-service
          predicates:
            - Path=/shopping-service/**

        - id: email
          uri: lb://email-service
          predicates:
            - Path=/email-service/**